<!DOCTYPE html>
<html itemscope itemtype="http://schema.org/Map" prefix="og: http://ogp.me/ns# fb: http://ogp.me/ns/fb#">
<head>
    <meta charset="utf-8"/>
    <title>earth :: an animated map of global wind and weather</title>
    <meta itemprop="name"                                      content="earth"/>
    <meta itemprop="description"     name="description"        content="an animated map of global wind and weather"/>
    <meta itemprop="author"          name="author"             content="Cameron Beccario"/>

    <meta property="og:type"        content="website"/>
    <meta property="og:title"       content="earth"/>
    <meta property="og:description" content="An animated map of global wind and weather. Visit the community at https://www.facebook.com/EarthWindMap"/>
    <meta property="og:url"         content="http://earth.nullschool.net"/>
    <meta property="og:image"       content="http://earth.nullschool.net/preview.jpg"/>

    <link rel="shortcut icon" href="/earth/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="120x120" href="/earth/iphone-icon.png"/>
    <link rel="apple-touch-icon" sizes="152x152" href="/earth/ipad-icon.png"/>
    <link rel="stylesheet" type="text/css" href="/earth/styles/styles.css"/>
    <script>
        if (new URLSearchParams(location.search).has("workspace")) {
            document.documentElement.classList.add("ogw-workspace");
        }
    </script>

    <link rel="alternate" hreflang="x-default" href="http://earth.nullschool.net/"/>
    <link rel="alternate" hreflang="ja" href="http://earth.nullschool.net/jp/"/>
</head>
<body data-lang="en">

    <!--[if lte IE 8]><p id="warn">This site requires IE9 or newer.</p><![endif]-->

    <div id="display">
        <svg id="map" class="fill-screen" xmlns="http://www.w3.org/2000/svg" version="1.1"></svg>
        <canvas id="animation" class="fill-screen"></canvas>
        <canvas id="overlay" class="fill-screen"></canvas>
        <svg id="foreground" class="fill-screen" xmlns="http://www.w3.org/2000/svg" version="1.1"></svg>
    </div>

    <div id="sponsor" class="invisible">
        <p><span id="sponsor-hide" class="text-button invisible"> ✕ </span>community</p>
        <a id="sponsor-link" href="https://www.facebook.com/EarthWindMap">EarthWindMap</a>
    </div>

    <div id="details">
        <p id="status"></p>
        <div id="location">
            <p>
                <span id="location-coord"></span>
                <span id="location-close" class="invisible text-button"> ✕ </span>
            </p>
            <p>
                <span id="location-wind"></span>
                <span id="location-wind-units" class="text-button"></span>
            </p>
            <p>
                <span id="location-value"></span>
                <span id="location-value-units" class="text-button"></span>
            </p>
        </div>

        <p id="earth">
            <span id="show-menu" class="text-button" title="展开或收起气象指标栏">气象项目</span>
            <span id="progress" class="invisible"></span>
        </p>

        <div id="menu">
            <p>数据时间 | <span
                id="data-date" class="local"></span> <span
                id="toggle-zone" class="text-button"></span>
            </p>
            <p>数据层 | <span id="data-layer"></span></p>
            <p><span id="scale-label">色标 | </span><canvas id="scale"></canvas></p>
            <p>来源 | <span id="data-center"></span></p>
            <p>时间控制 | <span
                class="text-button" id="nav-now" title="当前条件">当前</span><span
                class="text-button" id="nav-backward-more"> « </span> – <span
                class="text-button" id="nav-backward"> ‹ </span> – <span
                class="text-button" id="nav-forward"> › </span> – <span
                class="text-button" id="nav-forward-more"> » </span><span
                class="text-button" id="show-location" title="当前位置">〖◯〗</span><span
                class="text-button" id="option-show-grid" title="显示或隐藏网格点">网格</span>
            </p>
            <p>模式 | <span
                class="text-button" id="wind-mode-enable">大气</span> – <span
                class="text-button" id="ocean-mode-enable">海洋</span>
            </p>
            <p class="wind-mode">高度 | <span
                class="surface text-button" id="surface-level" title="地表">地表</span> – <span
                class="surface text-button" id="isobaric-1000hPa">1000</span> – <span
                class="surface text-button" id="isobaric-850hPa">850</span> – <span
                class="surface text-button" id="isobaric-700hPa">700</span> – <span
                class="surface text-button" id="isobaric-500hPa">500</span> – <span
                class="surface text-button" id="isobaric-250hPa">250</span> – <span
                class="surface text-button" id="isobaric-70hPa">70</span> – <span
                class="surface text-button" id="isobaric-10hPa">10</span> hPa
            </p>
            <p class="wind-mode">覆盖指标 | <span
                class="text-button" id="overlay-off">无</span> – <span
                class="text-button" id="overlay-wind" title="风速">风速</span> – <span
                class="text-button" id="overlay-temp" title="温度">温度</span> – <span
                class="text-button" id="overlay-relative_humidity" title="相对湿度">湿度</span> – <span
                class="text-button" id="overlay-air_density" title="空气密度">空气密度</span> – <span
                class="text-button" id="overlay-wind_power_density" title="风能密度">风能密度</span>
            </p>
            <p class="wind-mode"><span
                class="text-button" id="overlay-total_precipitable_water" title="可降水量">可降水量</span> – <span
                class="text-button" id="overlay-total_cloud_water" title="云水量">云水量</span> – <span
                class="text-button" id="overlay-mean_sea_level_pressure" title="海平面气压">海平面气压</span>
            </p>
            <p class="ocean-mode invisible">动画 | <span
                class="text-button" id="animate-currents" title="海流">海流</span>
            </p>
            <p class="ocean-mode invisible">覆盖指标 | <span
                class="text-button" id="overlay-ocean-off">无</span> – <span
                class="text-button" id="overlay-currents" title="海流">海流</span>
            </p>
            <p class="ocean-mode invisible"><span style="visibility:hidden">覆盖指标</span> |</p>
            <p>投影 | <span
                class="proj text-button" id="atlantis" title="亚特兰蒂斯投影">A</span> – <span
                class="proj text-button" id="azimuthal_equidistant" title="方位等距投影">AE</span> – <span
                class="proj text-button" id="conic_equidistant" title="圆锥等距投影">CE</span> – <span
                class="proj text-button" id="equirectangular" title="等距圆柱投影">E</span> – <span
                class="proj text-button" id="orthographic" title="正射投影">O</span> – <span
                class="proj text-button" id="stereographic" title="球极平面投影">S</span> – <span
                class="proj text-button" id="waterman" title="Waterman 蝴蝶投影">WB</span> – <span
                class="proj text-button" id="winkel3" title="Winkel Tripel 投影">W3</span>
            </p>
            <!--<p>免責事項 | 正確な情報を提供するためのものではありません</p>-->
            <p>
                <a href="about.html" class="internal-link">关于</a>
                <a href="https://www.facebook.com/EarthWindMap" class="social-icon" title="Facebook">&#xe027;</a>
                <a href="https://twitter.com/cambecc" class="social-icon" title="Twitter">&#xe086;</a>
            </p>
        </div>
    </div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/underscore.js/1.6.0/underscore-min.js" charset="utf-8"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/backbone.js/1.1.0/backbone-min.js" charset="utf-8"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/topojson/1.1.0/topojson.min.js" charset="utf-8"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/d3/3.3.10/d3.min.js" charset="utf-8"></script>

<!--
    <script src="/earth/libs/underscore.js/1.6.0/underscore.js" charset="utf-8"></script>
    <script src="/earth/libs/backbone.js/1.1.0/backbone.js" charset="utf-8"></script>
    <script src="/earth/libs/topojson/1.1.0/topojson.js" charset="utf-8"></script>
    <script src="/earth/libs/d3/3.3.10/d3.js" charset="utf-8"></script>
-->

    <script src="/earth/libs/d3.geo/0.0.0/d3.geo.projection.v0.min.js" charset="utf-8"></script>
    <script src="/earth/libs/d3.geo/0.0.0/d3.geo.polyhedron.v0.min.js" charset="utf-8"></script>
    <script src="/earth/libs/when/2.6.0/when.js" charset="utf-8"></script>

    <script src="/earth/libs/earth/1.0.0/micro.js" charset="utf-8"></script>
    <script src="/earth/libs/earth/1.0.0/globes.js" charset="utf-8"></script>
    <script src="/earth/libs/earth/1.0.0/products.js" charset="utf-8"></script>
    <script src="/earth/libs/earth/1.0.0/earth.js" charset="utf-8"></script>

</body>
</html>
